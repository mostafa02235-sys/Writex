# Temporary helper: records the llama.cpp API and model download sizes.
name: Probe local AI sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          git clone -q --depth 1 --branch b4600 https://github.com/ggml-org/llama.cpp lc
          cp lc/include/llama.h llama.h
          cp lc/examples/simple-chat/simple-chat.cpp simple-chat.cpp
          cp lc/examples/llama.android/llama/src/main/cpp/CMakeLists.txt android-CMakeLists.txt 2>/dev/null || true
          ls lc/examples/llama.android/llama/src/main/cpp/ > android-cpp-files.txt 2>&1 || true
          cp lc/grammars/json.gbnf json.gbnf
          (cd lc && git log -1 --format='%H %cd') > version.txt
          rm -rf lc
          for u in \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf ; do
            echo "$u $(curl -sIL "$u" | grep -i '^content-length' | tail -1 | tr -d '\r') $(curl -sIL -o /dev/null -w '%{http_code}' "$u")" >> models.txt
          done
          git init -q -b probe && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe
